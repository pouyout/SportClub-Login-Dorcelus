<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Coach - SportClub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="dashboard">

        <h1 id="bienvenidaCoach">
            Panel del Coach
        </h1>

        <div class="dashboard-grid">

            <div class="dashboard-card">
                <h2>Alumnos</h2>
                <p>25 alumnos activos</p>
            </div>

            <div class="dashboard-card">
                <h2>Clases Hoy</h2>
                <p>8 sesiones programadas</p>
            </div>

            <div class="dashboard-card">
                <h2>Horas Semanales</h2>
                <p>40 horas</p>
            </div>

        </div>

        <div class="dashboard-card-large">

            <h2>Listado de Alumnos</h2>

            <table>

                <tr>
                    <th>Nombre</th>
                    <th>Disciplina</th>
                </tr>

                <tr>
                    <td>María González</td>
                    <td>CrossFit</td>
                </tr>

                <tr>
                    <td>Carlos Rojas</td>
                    <td>Yoga</td>
                </tr>

                <tr>
                    <td>Valentina Pérez</td>
                    <td>Funcional</td>
                </tr>

                <tr>
                    <td>Javier Torres</td>
                    <td>Musculación</td>
                </tr>

                <tr>
                    <td>Fernanda Díaz</td>
                    <td>Spinning</td>
                </tr>

            </table>

        </div>

        <br>

        <div class="dashboard-footer">

            <a href="profile.html">
                Mi Perfil
            </a>

            <a href="../index.html">
                Volver al Inicio
            </a>

            <button onclick="logout()">
                Cerrar Sesión
            </button>

        </div>

    </div>

    <script>

        const user = JSON.parse(
            localStorage.getItem("user")
        );

        if (!user || user.role !== "coach") {

            window.location.href =
                "../pages/login.html";

        }

        document.getElementById(
            "bienvenidaCoach"
        ).textContent =
            `Bienvenido Coach ${user.full_name}`;

        function logout() {

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            window.location.href =
                "../pages/login.html";

        }

    </script>

</body>

</html>
