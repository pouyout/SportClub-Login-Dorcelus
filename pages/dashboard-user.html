<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Usuario - SportClub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="dashboard">

        <h1 id="bienvenida"></h1>

        <div class="dashboard-grid">

            <div class="dashboard-card">
                <h2>Mis Clases</h2>
                <p>5 clases activas</p>
            </div>

            <div class="dashboard-card">
                <h2>Próxima Sesión</h2>
                <p>Lunes 18:00 hrs</p>
            </div>

            <div class="dashboard-card">
                <h2>Coach Asignado</h2>
                <p>Juan Pérez</p>
            </div>

        </div>

        <div class="dashboard-card-large">

            <h2>Reservas Recientes</h2>

            <table>
                <tr>
                    <th>Clase</th>
                    <th>Fecha</th>
                </tr>

                <tr>
                    <td>CrossFit</td>
                    <td>10/06/2026</td>
                </tr>

                <tr>
                    <td>Yoga</td>
                    <td>12/06/2026</td>
                </tr>

                <tr>
                    <td>Funcional</td>
                    <td>15/06/2026</td>
                </tr>

            </table>

        </div>

        <br>

        <a href="../index.html">Volver al Inicio</a>

    </div>
   <script>

const user = JSON.parse(localStorage.getItem("user"));

if (user) {

    document.getElementById("bienvenida").textContent =
        `Bienvenido ${user.full_name || user.fullname}`;

}

</script>

</body>

</html>
